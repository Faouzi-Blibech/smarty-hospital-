; ESP32 + SSD1306 OLED + buzzer, triggered from the PC over Bluetooth LE.
; Build + flash: pio run -e <env> -t upload   ·   Serial log: pio device monitor
;   esp32c3  = ESP32-C3 boards (SuperMini, DevKitM-1, XIAO)
;   esp32dev = classic ESP32 DevKit V1 (ESP32-WROOM-32, CP210x USB)

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.12.1

[env:esp32c3]
board = esp32-c3-devkitm-1
; SuperMini / XIAO: the USB port is the chip's native USB, so route Serial to it.
; Remove these two flags for a C3 board with a CP210x / CH340 USB chip.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DPIN_SDA=5
  -DPIN_SCL=6
  -DPIN_BUZZER=4

[env:esp32dev]
board = esp32dev
upload_port = COM5
monitor_port = COM5
build_flags =
  -DPIN_SDA=21
  -DPIN_SCL=22
  -DPIN_BUZZER=4
  -DSCREEN_H=32          ; 0.91" OLED 128x32 (use 64 for a 0.96" OLED)
